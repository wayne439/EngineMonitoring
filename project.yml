# XcodeGen spec. The checked-in EngineMonitoring.xcodeproj is the source of truth;
# this file is kept in sync so the project can be regenerated with `xcodegen generate` if needed.
name: EngineMonitoring
options:
  bundleIdPrefix: com.fueledconsulting
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.2"
    CURRENT_PROJECT_VERSION: "35"
targets:
  EngineMonitoring:
    type: application
    platform: iOS
    sources:
      - path: EngineMonitoring
        excludes:
          - Resources
          - Info.plist
          - EngineMonitoring.entitlements
      - path: EngineMonitoring/Resources
        type: group  # files are copied flat into the bundle root, as Bundle.main lookups expect
        buildPhase: resources
    info:
      path: EngineMonitoring/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fueledconsulting.EngineMonitoring
        PRODUCT_NAME: EnginePulse
        PRODUCT_MODULE_NAME: EngineMonitoring
        CODE_SIGN_ENTITLEMENTS: EngineMonitoring/EngineMonitoring.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: D64ZNA8J2P
  EngineMonitoringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EngineMonitoringTests
    dependencies:
      - target: EngineMonitoring
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fueledconsulting.EngineMonitoringTests
        DEVELOPMENT_TEAM: D64ZNA8J2P
schemes:
  EngineMonitoring:
    build:
      targets:
        EngineMonitoring: all
    test:
      targets:
        - EngineMonitoringTests
